<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NCCL 非齲蝕性齒頸部病變｜動畫教學簡報</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Serif+TC:wght@500;700&display=swap">
<style>
:root{--bg:#0b1631;--card:#0e1b3d;--gold:#e8c46a;--tx:#e8eefc;--mut:#9fb0d4;--cy:#2ee6d6;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;color:var(--tx);font:500 16px/1.7 'Noto Serif TC','PingFang TC','Microsoft JhengHei',serif;background:radial-gradient(ellipse at 30% 10%,#1a2f66 0,var(--bg) 55%,#050b1c 100%)}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes rot{to{--a:360deg}}
@keyframes sh{to{background-position:-200% 0}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes cut{to{transform:scaleX(1)}}
@keyframes wig{0%,100%{transform:translateY(-10px)}50%{transform:translateY(10px)}}
@keyframes fall{0%{transform:translateY(0);opacity:0}25%{opacity:1}100%{transform:translateY(55px);opacity:0}}
@keyframes rise{0%{transform:translateY(0);opacity:0}25%{opacity:1}100%{transform:translateY(-95px);opacity:0}}
@keyframes pl{50%{transform:translateY(14px)}}
@keyframes tilt{50%{transform:rotate(2.5deg)}}
@keyframes bl{50%{opacity:.25}}
.s{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:26px;padding:44px 22px 190px;overflow-y:auto;opacity:0;visibility:hidden;transition:opacity .7s,visibility .7s}
.s.on{opacity:1;visibility:visible}
.tx{flex:1 1 280px;max-width:520px}
.v{flex:0 1 320px;width:min(320px,74vw);padding:10px;border-radius:20px;position:relative;isolation:isolate}
.v::before{content:"";position:absolute;inset:-2px;border-radius:22px;background:conic-gradient(from var(--a),var(--gold),var(--cy),#7b6cff,var(--gold));animation:rot 6s linear infinite;z-index:-2}
.v::after{content:"";position:absolute;inset:0;border-radius:20px;background:var(--card);z-index:-1}
.v svg{width:100%;display:block}
h1,h2{margin:0 0 12px;font-family:'Cinzel','Noto Serif TC',serif;line-height:1.3;background:linear-gradient(100deg,#b8892e,#ffe9a8,#b8892e);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}
h1{font-size:clamp(46px,11vw,84px);letter-spacing:.06em}
h2{font-size:clamp(23px,5.2vw,34px)}
h2.sm{font-size:clamp(20px,4.6vw,30px)}
.en{color:var(--mut);font-size:14px;margin:0 0 6px}
.rf{color:var(--mut);font-size:12px;line-height:1.6;margin-top:14px}
ul{list-style:none;margin:0;padding:0}
li{margin:8px 0;padding:8px 14px;border-left:3px solid var(--gold);background:#ffffff0d;border-radius:0 12px 12px 0;opacity:0}
.on li{animation:up .7s forwards;animation-delay:calc(var(--i)*1s + .4s)}
.p{opacity:0}.on .p{animation:up .8s .4s forwards}
.nt{transform-box:fill-box;transform-origin:left center;transform:scaleX(0)}
.on .nt{animation:cut 4.5s .8s forwards ease-in-out}
.nt.full{transform:scaleX(1);animation:none!important}
.on .br{animation:wig .55s infinite ease-in-out}
.dr,.ri{opacity:0}
.on .dr{animation:fall 1.7s infinite}.on .ri{animation:rise 1.9s infinite}
.on .ar{animation:pl 1s infinite ease-in-out}.on .pu{animation:bl 1s infinite}
.on .g-st,.on .g-q{transform-origin:100px 280px;animation:tilt 1.1s infinite ease-in-out}
.ph{flex:0 1 380px;width:min(380px,88vw)}.ph.two{flex-basis:560px;width:min(560px,92vw);display:grid;grid-template-columns:1fr 1fr;gap:8px}.ph figure{margin:0 0 8px}.ph img{width:100%;display:block;border-radius:10px}.ph figcaption{font-size:12px;line-height:1.5;color:var(--mut);padding:4px 2px}
#ct{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,#050b1ce6 40%);text-align:center}
#sub{min-height:3.6em;max-width:780px;margin:0 auto 8px;font-size:14px;line-height:1.7}
#pg{height:4px;max-width:780px;margin:0 auto 10px;border-radius:2px;background:#ffffff22}
#bar{height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,var(--gold),var(--cy));transition:width .6s}
button{width:44px;height:44px;margin:0 5px;border-radius:50%;border:1.5px solid var(--gold);background:var(--card);color:var(--gold);font-size:17px;cursor:pointer}
button:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
button.act{background:var(--gold);color:var(--bg)}
.sg{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:14px;font-size:12px;color:var(--mut);letter-spacing:.08em}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>

const D=[
{t:'NCCL',h:'非齲蝕性齒頸部病變',en:'Non-carious Cervical Lesions',note:'自動播放中，按 🔊 可開啟語音旁白',x:'n',
n:'今天要認識 NCCL，全名 Non-carious Cervical Lesions，中文是非齲蝕性齒頸部病變。'},
{h:'什麼是 NCCL？',en:'NCCL ( Non-carious Cervical Lesions )',x:'n',
l:['齒頸部、接近牙釉質與牙骨質交界處（CEJ）的硬組織缺損','缺損與細菌無關，不是蛀牙','保存牙科、牙周病學、贋復牙科、牙齒黏著修復的重要議題','系統性回顧：成人盛行率約 46.7%，隨年齡增加；各研究數字因定義與檢查方式而異'],
n:'NCCL 是發生在齒頸部、接近釉質牙骨質交界處的硬組織缺損，與細菌無關。它是保存牙科、牙周病學、贋復牙科與黏著修復都會遇到的議題。一篇系統性回顧估計，成人盛行率約百分之四十六點七，並隨年齡上升，但各研究數字會因定義與檢查方式而不同。'},
{h:'最重要的觀念',x:'n',
l:['NCCL 並非單純由刷牙太用力造成','機械性磨耗＋化學性酸蝕＋可能的咬合應力','三者共同影響，逐漸形成非齲蝕性組織缺損'],
n:'最重要的觀念是：NCCL 並非單純由刷牙太用力造成。它是牙齒硬組織在齒頸部，受到機械性磨耗、化學性酸蝕，以及可能的咬合應力共同影響，逐漸形成的缺損。'},
{h:'① 機械性磨耗',en:'Abrasion / Friction',x:'brush',
l:['錯誤的刷牙方式：頻率、力道、牙刷硬度皆為文獻中的風險因子','牙膏過於粗糙（磨耗性高）','有文獻認為：邊緣銳利清楚的缺損，較可能與磨耗有關'],
n:'第一個機制是機械性磨耗。刷牙的頻率、力道與牙刷硬度，都是文獻中的風險因子，過於粗糙的牙膏也會增加磨耗。有文獻認為，邊緣銳利清楚的缺損，較可能與磨耗有關。'},
{h:'磨耗的臨床外觀',en:'Abrasion（Friction）',im:[['2926','磨耗（Abrasion）：牙齦退縮、牙根面外露處的齒頸部缺損。'],['2925','上顎前牙舌側面磨損、牙本質外露。※ 舌側磨損型態也常見於內因性酸蝕，需依病史鑑別。']],two:1,
l:['Abrasion：由牙齒以外的物理因素造成的磨損，與咬合無關','常見原因：過度用力的刷牙習慣','橫向大力刷、硬毛牙刷與粗糙牙膏','酸使表面軟化後，更容易被磨耗'],
n:'磨耗，英文 Abrasion，是牙齒以外的物理因素造成的組織磨損，與咬合無關，最常見的原因是過度用力的刷牙習慣。右邊的舌側磨損型態也常見於內因性酸蝕，要依病史鑑別。'},
{h:'② 化學性酸蝕',en:'Erosion',x:'acid',
l:['外因性酸蝕：酸性飲食與飲料','內因性酸蝕：胃酸逆流等','有文獻認為：酸蝕造成的缺損較寬、較淺，呈碟狀'],
n:'第二個機制是化學性酸蝕。外因性酸蝕來自酸性飲食，內因性酸蝕則來自胃酸逆流。有文獻認為，酸蝕造成的缺損較寬、較淺，呈碟狀。'},
{h:'酸蝕的臨床特徵',en:'Erosion',im:[['2919','酸蝕（Erosion）：多顆牙的牙面與切緣出現組織流失的臨床外觀。']],
l:['Erosion：非細菌來源的酸，造成牙齒硬組織漸進性流失','光滑牙面上寬而淺的凹陷，牙面原有形態消失','切緣透明度增加、崩損，或咬合面呈杯狀凹陷（牙本質外露）','唾液流量下降會加重酸蝕'],
n:'酸蝕，英文 Erosion，是非細菌來源的酸造成的牙齒硬組織漸進性流失。臨床上常見光滑牙面出現寬而淺的凹陷、原有形態消失、切緣變透明或崩損。唾液流量下降會加重酸蝕。'},
{h:'外因性與內因性酸蝕',en:'Extrinsic / Intrinsic',im:[['2923','外因性酸蝕（Extrinsic）：酸來自體外。'],['2924','內因性酸蝕（Intrinsic）：(a) 正面觀 (b) 上顎咬合面觀，可見前牙舌側面組織流失。']],two:1,
l:['外因性：酸性飲食與飲料（柑橘、果汁、汽水、酒）、酸性漱口水與藥物、職業性酸暴露','外因性好發於上顎前牙唇面，呈杓狀凹陷','內因性：胃酸經逆流或嘔吐進入口腔，如胃食道逆流疾病、進食障礙','內因性先侵犯上顎前牙舌側，以及後牙咬合面'],
n:'酸蝕依來源分為外因性與內因性。外因性來自酸性飲食、飲料、漱口水或職業性酸暴露，好發於上顎前牙唇面。內因性來自胃酸逆流或嘔吐，常先侵犯上顎前牙舌側與後牙咬合面。'},
{h:'③ 應力集中與咬合干擾',en:'Abfraction（假說）',x:'stress',
l:['咬合力使牙齒在齒頸部彎曲，產生壓縮與拉伸應力','推論造成微裂損與組織流失；字源意為「斷裂脫落」','理論上也使表面更易受酸蝕與磨耗'],
n:'第三個是應力集中與咬合干擾，也就是 abfraction 假說。咬合力讓牙齒在齒頸部彎曲，產生壓縮與拉伸應力，推論會造成微裂損與組織流失，也可能讓表面更容易受到酸蝕與磨耗。'},
{h:'Abfraction 臨床外觀',en:'Abfraction',im:[['2920','箭頭處為 abfraction 病灶；旁邊的牙齒亦可見齒頸部缺損與牙齦退縮。']],
l:['多見於頰側面，典型為楔形（V 形），內外角界線清楚','深度可大於寬度，視進展階段而定','位於齦緣下、刷牙難以觸及的病灶，被認為與咬合負載有關','但理論尚未證實，仍須排除磨耗與酸蝕'],
n:'Abfraction 多見於頰側面，典型為楔形，內外角界線清楚。位於齦緣下、刷牙難以觸及的病灶，被認為可能與咬合負載有關。但理論尚未證實，仍須排除磨耗與酸蝕。'},
{h:'Abfraction 示意圖',en:'示意圖（自繪）',im:[['cmp','左：正常牙齒；右：齒頸部出現 abfraction 缺損的示意。']],
l:['理論：咬合壓縮力與拉伸應力，使牙齒在齒頸部彎曲','微裂損、疲勞與組織流失，形成楔形缺損','齒頸部釉質較薄，被認為更易受影響（理論）','字源：ab（離開）＋ fractio（斷裂），意為「斷裂脫落」'],
n:'示意圖說明 abfraction 理論：咬合壓縮力與拉伸應力，使牙齒在齒頸部彎曲，產生微裂損與組織流失，形成楔形缺損。這個字源自拉丁文，意為斷裂脫落。'},
{h:'⚠ 爭議：不能全歸咎咬合力',en:'Abfraction 的獨立致病角色至今仍有爭議',x:'q',
l:['不能直接把所有楔形缺損都歸因於咬合力過大','文獻中有支持咬合應力參與的系統性回顧，也有質疑咬合病因的研究','磨耗與酸蝕是廣泛接受的機制，但單靠兩者未必能解釋所有病灶','仍需納入磨耗與酸蝕的前瞻性縱貫研究來釐清'],
n:'需要特別注意：abfraction 的獨立致病角色至今仍有爭議，不能直接把所有楔形缺損都歸因於咬合力過大。文獻中既有支持咬合應力參與的回顧，也有質疑的研究。磨耗與酸蝕是廣泛接受的機制，但其餘仍需前瞻性縱貫研究釐清。'},
{h:'三種機制如何相互作用',x:'all',
l:['同一位患者常同時存在多種機制，貢獻會隨時間改變','化學、生物與行為因素的交互作用，解釋個體差異','例：酸使表面軟化，刷牙磨耗更容易移除組織'],
n:'三種機制很少單獨存在。同一位患者常同時有多種機制，貢獻也會隨時間改變。化學、生物與行為因素的交互作用，可以解釋個體差異。例如酸使表面軟化後，刷牙的磨耗更容易移除組織。'},
{h:'病灶形態：楔形・碟形・混合',en:'Wedge / Saucer / Mixed',im:[['2907','三種常見形態示意（左至右：楔形、碟形、混合型）。原圖標示為 abfraction lesion；形態分類適用於 NCCL，並不代表病因已確定。']],
l:['楔形（V 形）：內、外角銳利，界線清楚','碟形（C／U 形）：底部圓鈍，輪廓較寬','混合型：牙齦側平坦、咬合側呈半圓','形態只能提示，不能單憑形狀判定病因：磨耗或酸蝕可使角度變鈍、輪廓更寬'],
n:'常見的病灶形態有三種：楔形、碟形與混合型。楔形的內外角銳利；碟形底部圓鈍；混合型牙齦側平坦、咬合側呈半圓。但形態只能提示，不能單憑形狀判定病因。'},
{h:'臨床外觀：齒頸部缺損',en:'Clinical appearance',im:[['2917','口內側面照：箭頭指出牙齒齒頸部的缺損。']],
l:['好發於前牙與小臼齒；下顎小臼齒較常見，也較嚴重','缺損多見於頰側面','多種形態的病灶並存，常提示多重因素','單顆牙獨有病灶時，咬合應力可能是主因之一'],
n:'臨床上，NCCL 以前牙與小臼齒較常見，下顎小臼齒更常見也更嚴重，多見於頰側面。若同一口腔出現多種形態的病灶，往往提示多重因素並存。'},
{h:'合併牙齦退縮',en:'Combined defect（CD）',im:[['2911','齒頸部深缺損併牙齦退縮，缺損內齒質外露、變色。'],['2910','近距離觀：齒頸部暗褐色缺損緊鄰牙齦緣。']],two:1,
l:['約半數牙齦退縮併有 NCCL（合併缺損）','合併缺損會降低根面完全覆蓋的機率','缺損可跨越牙冠與牙根，使 CEJ 標誌消失'],
n:'當齒頸部缺損合併牙齦退縮，稱為合併缺損。約半數牙齦退縮合併 NCCL，這會降低根面完全覆蓋的機率。缺損可跨越牙冠與牙根，使 CEJ 標誌消失。'},
{h:'怎麼看：CEJ 與階差',en:'Pini-Prato classification',im:[['2909','(a)(b) 兩個角度的臨床照。(b) 可見齒頸部深凹的 V 形缺損，邊緣齒質變色。'],['2908','(a)(b) 判讀練習：CEJ 還看得到嗎？牙冠與牙根之間有無階差？']],
l:['A／B 類：CEJ 可辨識／不可辨識','＋／－：牙根面有／無階差；階差大於 0.5 mm 視為臨床門檻','極深的缺損常呈 V 形（2021 年文獻另增 A+V、B+V 亞類）','正面照看不出深度，需搭配側面觀評估'],
n:'判讀這類照片，要看兩件事：釉質牙骨質交界 CEJ 還看不看得到，以及牙冠與牙根之間有沒有階差。Pini-Prato 分類依此分為 A 類與 B 類，階差超過零點五毫米視為臨床門檻；極深的缺損常呈 V 形。'},
{h:'牙髓與 NCCL',en:'Pulp and cervical lesions',im:[['2918','下顎第二小臼齒 CT 三維重建（紅色為牙髓）。This CT scan of a mandibular second premolar shows a substantial extension of the pulp toward the facial surface.']],
l:['牙髓向頰側（facial）明顯延伸','頰側齒頸部缺損加深時，與牙髓的距離可能縮短（教學推論）','缺損接近牙髓或牙髓已暴露，是文獻列出的考慮修復條件之一','牙齒會以反應性、修復性牙本質及小管堵塞等機制防禦'],
n:'這是下顎第二小臼齒的 CT：This CT scan of a mandibular second premolar shows a substantial extension of the pulp toward the facial surface. 也就是牙髓明顯向頰側延伸。因此頰側齒頸部缺損加深時，可能更接近牙髓。'},
{h:'臨床評估：逐一排查',x:'all',
l:['飲食與酸性飲料、胃食道逆流相關症狀','刷牙習慣：頻率、力道、牙刷與牙膏','副功能習慣與咬合狀態','年齡、牙齦退縮與敏感症狀'],
n:'臨床上要逐一評估所有可能因素：飲食與胃酸逆流、刷牙習慣、副功能習慣與咬合，以及年齡、牙齦退縮與敏感症狀。因為各因素的貢獻會隨時間改變。'},
{h:'觀察與記錄病灶',en:'Stereomicroscopic examination',im:[['2921','Positioning of teeth for stereomicroscopic examination.（離體牙置於立體顯微鏡下觀察的定位）']],
l:['臨床：標準化口內照、研究模型、定期測量病灶尺寸','刮痕測試：在病灶刻痕，追蹤刻痕是否變模糊，以判斷是否仍在進展','磨耗指數：Smith 與 Knight 指數 0–4 級，4 級為深度超過 2 mm 或暴露次級牙本質／牙髓','實驗研究：以立體顯微鏡檢視離體牙病灶'],
n:'臨床上可用標準化口內照、研究模型與定期測量來記錄病灶，也可用刮痕測試判斷是否仍在進展。實驗研究中，會把離體牙定位在立體顯微鏡下觀察：Positioning of teeth for stereomicroscopic examination.'},
{h:'處置原則（文獻重點）',x:'n',f:1,
l:['先找出並控制致病因素','無症狀、牙髓活力與功能未受影響：先追蹤，至少觀察六個月再考慮侵入性處置（以 abfraction 病灶回顧為據）','修復時機：恢復形態與功能、緩解過敏，或美觀需求','合併牙齦退縮：可考慮修復與牙周手術合併處理','有回顧指出：修復或咬合調整，不能預防 abfraction 病灶繼續惡化'],
n:'處置上，先找出並控制致病因素。無症狀且牙髓活力與功能未受影響時，先追蹤，至少觀察六個月，再考慮侵入性處置。需要修復的時機，是恢復形態與功能、緩解過敏或美觀需求。合併牙齦退縮時，可考慮修復與牙周手術合併處理。有回顧指出，修復或咬合調整本身，並不能預防缺損繼續惡化。'},
{h:'何時可以不補',en:'保守處理與追蹤',x:'n',
l:['缺損很淺（常以約 1 mm 為參考）、無敏感、不卡食物、外觀可接受，且追蹤沒有明顯變大','改善刷牙：軟毛牙刷、輕力，避免橫向用力刷','控制酸蝕來源：減少酸性飲食的頻率','使用含氟牙膏或牙醫師建議的去敏感產品','每 6 至 12 個月檢查、拍照或測量'],
n:'缺損很淺、沒有敏感、不卡食物、外觀可接受，且追蹤沒有明顯變大時，通常先保守處理：改善刷牙方式、減少酸性飲食、使用含氟或去敏感產品，並每六到十二個月追蹤。'},
{h:'何時建議補牙',en:'修復的適應症',x:'n',f:1,
l:['明顯敏感且去敏感處理無效：修復可覆蓋外露牙本質','缺損較深、損及牙齒結構或接近牙髓：保護牙髓與牙齒強度','容易卡食物、清潔困難或牙齦發炎，例如邊緣位於齦下','前牙區影響美觀：可用樹脂修復','需要牙周手術或根面覆蓋：通常先修復缺損，再做手術','缺損持續變深：先重新評估成因；修復並不能阻止惡化'],
n:'建議補牙的情況包括：明顯敏感且處理無效、缺損較深或接近牙髓、容易卡食物或牙齦發炎、前牙區影響美觀，以及需要牙周手術時。若缺損持續變深，要先重新評估成因，因為修復並不能阻止惡化。'},
{h:'常用修復材料',en:'Composite resin / Glass ionomer',x:'n',f:1,
l:['複合樹脂：最常用；美觀、黏著性佳，適合可隔濕且重視美觀的病灶','玻璃離子體（GIC）：可釋氟、對齦下環境較能容忍；常用於不易隔濕、較深或美觀要求不高處，有時與樹脂合併','樹脂改良型玻璃離子體日久可能變色，美觀區需斟酌','橡皮障隔濕可明顯提升黏著修復的長期表現','材料由牙醫師依深度、位置、牙齦、隔濕與美觀決定'],
n:'常用修復材料有複合樹脂與玻璃離子體。複合樹脂最常用，美觀且黏著性佳；玻璃離子體可釋氟，對齦下環境較能容忍。橡皮障隔濕能提升黏著修復的長期表現。材料由牙醫師依情況決定。'},
{h:'最關鍵的一點',en:'補牙是補回已流失的組織，不是治療 NCCL 的根本原因',x:'n',f:1,
l:['① 評估成因','② 改善刷牙、飲食與咬合問題','③ 去敏感與定期追蹤','④ 有明確適應症才修復','⑤ 修復後持續預防與追蹤','成因未處理，修復體仍可能邊緣滲漏、脫落，周圍再出現新缺損'],
n:'最關鍵的一點：補牙是補回已流失的組織，不是治療 NCCL 的根本原因。正確順序是：評估成因、改善刷牙飲食與咬合、去敏感與定期追蹤、有明確適應症才修復，修復後仍要持續預防與追蹤。'},
{h:'結合治療的臨床序列',en:'Restorative + periodontal surgery',im:[['2915','(a)→(c) 同一部位的連續照片，呈現先修復缺損、再以牙周手術覆蓋根面的結合治療概念。各格時間點請依原出處核對。']],
l:['修復應先於手術，提供穩定、堅硬且凸的基底','修復要重建冠部輪廓與喪失的 CEJ 位置','常搭配冠向推進瓣（CAF）加結締組織移植（CTG）','部分修復的邊緣常置於估計 CEJ 下方 0.5–1 mm（CEJ+1 mm）'],
n:'結合治療的概念是：先修復缺損，再做牙周手術覆蓋根面。修復要重建冠部輪廓與缺失的 CEJ 位置，並常搭配冠向推進瓣加結締組織移植。'},
{h:'講者評註：三個教學提醒',x:'q',
l:['把 NCCL 當作描述性診斷，成因逐例判斷，不先預設','把 abfraction 標示為「有爭議的假說」，不與磨耗、酸蝕並列為定論','盛行率等數字隨定義與檢查方式而異，引用時註明來源'],
n:'講者評註，有三個教學提醒。第一，NCCL 是描述性診斷，成因要逐例判斷。第二，abfraction 要標示為有爭議的假說，不與磨耗和酸蝕並列為定論。第三，盛行率等數字隨定義而異，引用時要註明來源。'},
{h:'總結',x:'all',f:1,
l:['NCCL ＝ 齒頸部、與細菌無關的硬組織缺損','多重因素：磨耗、酸蝕、可能的咬合應力','Abfraction 仍有爭議；處置前先評估、再追蹤'],
r:'資料來源（摘要層級查證）：Abfraction lesions: etiology, diagnosis, and treatment options（Clin Cosmet Investig Dent 2016;8:79–87）；Prevalence of noncarious cervical lesions among adults: a systematic review（Teixeira 等，2020）；Abfraction Theory: Controversy Analysis, Scoping Review；A critical review of non-carious cervical (wear) lesions and the role of abfraction, erosion, and abrasion；Rethinking the decision-making process to treat gingival recession associated with non-carious cervical lesions（Braz Oral Res 2021;35 Suppl 2:e096）；形態分類（Hur 等，J Oral Rehabil 2011，經上列文獻引述）。臨床照片與示意圖由提供者提供，原始圖說與授權請依各自出處核對。磨耗、酸蝕定義與外因性／內因性分布：Oral Health Group〈An overview on dental wear〉等通識資料。Abfraction 示意圖為自繪，未使用付費圖庫圖片。僅供教學參考，不構成臨床診療建議。',
n:'總結。NCCL 是齒頸部、與細菌無關的硬組織缺損，成因是多重因素：磨耗、酸蝕，以及可能的咬合應力。Abfraction 仍有爭議，處置前要先評估、再追蹤。'}];
const B='<g class="br"><rect x="-62" y="122" width="86" height="12" rx="6" fill="#e8c46a"/><rect x="22" y="108" width="26" height="40" rx="4" fill="#7be0d6"/></g>',
A='<g fill="#ff9d5c"><circle class="dr" cx="70" cy="-10" r="6"/><circle class="dr" cx="100" cy="-20" r="6" style="animation-delay:.5s"/><circle class="dr" cx="130" cy="-10" r="6" style="animation-delay:1s"/></g><g fill="#6df09a"><circle class="ri" cx="168" cy="235" r="6"/><circle class="ri" cx="178" cy="245" r="6" style="animation-delay:.7s"/><circle class="ri" cx="160" cy="250" r="6" style="animation-delay:1.2s"/></g><text x="-60" y="-8" fill="#ff9d5c" font-size="15">外因性</text><text x="190" y="270" fill="#6df09a" font-size="15" text-anchor="end">內因性</text>',
T='<g stroke="#ff6b6b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"><path class="ar" d="M70 -22v34m-9-10l9 12l9-12"/><path class="ar" d="M100 -26v34m-9-10l9 12l9-12" style="animation-delay:.2s"/><path class="ar" d="M130 -22v34m-9-10l9 12l9-12" style="animation-delay:.4s"/></g><path class="pu" d="M36 100q-12 28 0 56M164 100q12 28 0 56" stroke="#ff6b6b" fill="none" stroke-width="3" stroke-dasharray="4 5"/>';
const X={n:'',brush:B,acid:A,stress:T,q:T+'<text class="pu" x="196" y="110" font-size="60" fill="#e8c46a">？</text>',all:B+A+T};
const deck=document.getElementById('deck');
D.forEach(s=>{const e=document.createElement('section');e.className='s';e.dataset.n=s.n;e.dataset.d=Math.max(8000,s.n.length*190+3000);const o=s.en?1:0;
e.innerHTML=`<div class="tx">${s.t?`<h1>${s.t}</h1>`:''}<h2${s.t?' class="sm"':''}>${s.h}</h2>${s.en?`<p class="en p">${s.en}</p>`:''}${s.note?`<p class="en p" style="animation-delay:1.6s">${s.note}</p>`:''}<ul>${(s.l||[]).map((a,i)=>`<li style="--i:${i+o}">${a}</li>`).join('')}</ul>${s.r?`<p class="rf p" style="animation-delay:5s">${s.r}</p>`:''}</div>${s.im?`<div class="v ph${s.two?' two':''}">${s.im.map(([k,c])=>`<figure><img src="${IM[k]}" alt="${c}"><figcaption>${c}</figcaption></figure>`).join('')}</div>`:`<div class="v"><svg viewBox="-70 -30 340 330" role="img" aria-label="牙齒示意動畫"><g class="g-${s.x=='stress'?'st':s.x}"><use href="#t"/><polygon class="nt${s.f?' full':''}" points="52,114 80,128 52,142" fill="#0b1631" stroke="#e8c46a" stroke-width="1.5"/></g>${X[s.x]}</svg></div>`}`;deck.appendChild(e)});
const S=[...document.querySelectorAll('.s')],sub=document.getElementById('sub'),bar=document.getElementById('bar'),pb=document.getElementById('pb'),vo=document.getElementById('vo');
let i=0,play=true,voice=false,tm,tok=0;
function go(n){clearTimeout(tm);tok++;try{speechSynthesis.cancel()}catch(e){}
i=Math.max(0,Math.min(S.length-1,n));S.forEach((s,k)=>s.classList.toggle('on',k==i));
const t=S[i].dataset.n;sub.textContent=t;bar.style.width=(i+1)/S.length*100+'%';
if(!play)return;
const id=tok,d=+S[i].dataset.d,nxt=()=>{if(id!==tok)return;if(i<S.length-1)go(i+1);else{play=false;pb.textContent='↻'}};
if(voice&&window.speechSynthesis){const ps=t.split(/([A-Za-z][A-Za-z\- ]*[A-Za-z]|[A-Za-z])/).filter(p=>p.trim());
ps.forEach((p,k)=>{const u=new SpeechSynthesisUtterance(p);u.lang=/^[A-Za-z]/.test(p.trim())?'en-US':'zh-TW';if(k==ps.length-1)u.onend=()=>{if(id!==tok)return;clearTimeout(tm);tm=setTimeout(nxt,1200)};speechSynthesis.speak(u)});tm=setTimeout(nxt,d*2.5)}
else tm=setTimeout(nxt,d)}
pb.onclick=()=>{if(pb.textContent=='↻'){play=true;pb.textContent='❚❚';go(0);return}play=!play;pb.textContent=play?'❚❚':'▶';go(i)};
document.getElementById('pv').onclick=()=>go(i-1);
document.getElementById('nx').onclick=()=>go(i+1);
vo.onclick=()=>{voice=!voice;vo.classList.toggle('act',voice);go(i)};
addEventListener('keydown',e=>{if(e.key=='ArrowRight')go(i+1);else if(e.key=='ArrowLeft')go(i-1);else if(e.key==' '){e.preventDefault();pb.click()}});
go(0);
</script>
